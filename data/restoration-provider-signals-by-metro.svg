    .value { fill: #f4f8ff; font-size: 15px; font-weight: 700; }
    .note { fill: #a7bad1; font-size: 14px; }
    .source { fill: #dfeaf8; font-size: 14px; font-weight: 650; }
    .track { fill: #17304b; }
