<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" role="img" aria-labelledby="title description">
  <title id="title">Provider-stated response and insurance-billing signals across RestoreRadar metros</title>
  <desc id="description">Horizontal bars compare the share of RestoreRadar-listed provider records whose websites state 24/7 response or direct insurance billing in 10 covered metros. This observational directory dataset is not a census or a performance test.</desc>
